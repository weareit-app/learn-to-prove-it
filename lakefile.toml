name = "learn_to_prove_it"
defaultTargets = ["LearnToProveIt"]
testDriver = "LearnToProveItTest"

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.35.0"

[[lean_lib]]
name = "LearnToProveIt"

# Tests are Lean files whose `#guard_msgs` checks fail the build; `lake test`
# builds them.
[[lean_lib]]
name = "LearnToProveItTest"

# Prints the exercise metadata that prove.how reads, as JSON.
[[lean_exe]]
name = "export-exercise-metadata"
root = "ExportExerciseMetadata"
